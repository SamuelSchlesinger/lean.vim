name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A test that errors mid-run can leave Vim hung in Ex mode; cap the job
    # rather than letting a wedged suite run for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # System/apt Vim on the runners predates uri_encode(); the plugin needs
      # Vim 9.2 (see plugin/lean.vim). Pin the patch level the suite is
      # documented against; the action caches the source build per OS.
      - name: Install Vim 9.2
        uses: rhysd/action-setup-vim@v1
        with:
          version: v9.2.0850
      - name: Show tool versions
        run: |
          vim --version | head -n 4
          python3 --version
      - name: Lint
        run: make lint < /dev/null
      - name: Test
        run: make test < /dev/null
